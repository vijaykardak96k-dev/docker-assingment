<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Full Stack Registration</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e3a5f);
        }
        .container {
            width: 360px;
            max-width: 90%;
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 15px 40px #0005;
        }
        h2 { text-align: center; color: #1e293b; }
        p { color: #64748b; text-align: center; }
        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .footer { font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>User Registration</h2>
        <p>Express Frontend + Flask Backend</p>

        <form action="/submit" method="POST">
            <input type="text" name="name"
                   placeholder="Enter your name" required>

            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <button type="submit">Submit Details</button>
        </form>

        <p class="footer">Powered by Docker Compose</p>
    </div>
</body>
</html>
