services:
  backend:
    build:
      context: ./backend
    image: vijaykardak/docker-assignment-backend:v1
    container_name: flask-backend
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    image: vijaykardak/docker-assignment-frontend:v1
    container_name: express-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
